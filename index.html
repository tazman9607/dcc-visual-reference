document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.book[data-book]').forEach(b=>b.addEventListener('click',()=>openBook(Number(b.dataset.book))));document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',e=>{e.stopPropagation();jumpCategory(t.dataset.cat)}));$('#home').onclick=home;$('#search').oninput=e=>search(e.target.value);document.body.addEventListener('click',e=>{const j=e.target.closest?.('[data-jump]');if(j){e.preventDefault();e.stopPropagation();jumpName(decodeURIComponent(j.dataset.jump))}});const vp=$('#viewport');vp.addEventListener('click',e=>{if(e.target.closest?.('button,input,a,[data-jump]'))return;if(scale>1.03||animating)return;const r=vp.getBoundingClientRect();if(e.clientX-r.left<r.width/2)prevPage();else nextPage()});vp.addEventListener('touchstart',e=>{if(e.target.closest?.('button,input'))return;if(e.touches.length===2){gesture='pinch';startDist=dist(e.touches[0],e.touches[1]);startScale=scale;const r=vp.getBoundingClientRect();originX=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;originY=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;e.preventDefault()}else if(e.touches.length===1){gesture='single';startX=lastX=e.touches[0].clientX;startY=lastY=e.touches[0].clientY}},{passive:false});vp.addEventListener('touchmove',e=>{if(gesture==='pinch'&&e.touches.length===2){e.preventDefault();scale=Math.max(1,Math.min(3.4,startScale*(dist(e.touches[0],e.touches[1])/startDist)));clampZoom();applyZoom()}else if(gesture==='single'&&e.touches.length===1&&scale>1.03){e.preventDefault();const x=e.touches[0].clientX,y=e.touches[0].clientY;panX+=x-lastX;panY+=y-lastY;lastX=x;lastY=y;clampZoom();applyZoom()}},{passive:false});vp.addEventListener('touchend',e=>{if(e.touches.length)return;if(gesture==='pinch'){gesture='none';clampZoom();applyZoom();lastTap=0;return}if(gesture==='single'){const moved=Math.hypot(lastX-startX,lastY-startY);if(moved<14){const now=Date.now();if(now-lastTap<280){const r=vp.getBoundingClientRect();originX=lastX-r.left;originY=lastY-r.top;scale=scale>1.1?1:2;panX=panY=0;applyZoom();lastTap=0}else lastTap=now}else lastTap=0}gesture='none'},{passive:false});window.addEventListener('resize',()=>{if(!$('#reader').classList.contains('hidden')){renderSpreadFor(currentNo);layoutBook(true);resetZoom()}});const q=new URLSearchParams(location.search);if(q.get('book'))openBook(Number(q.get('book')))});
