name: Replace with correct DCC version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull newest correct preview build
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dcc-reference-edition-16py90cbz-keeks2.vercel.app"
          rm -rf assets images
          curl -fsSL "$BASE/" -o index.html
          mkdir -p assets
          for f in             brandon-andrews.webp             carl-p1.webp carl.webp carl-p2.webp             chris-andrews.webp clurichauns.webp elle-mcgibbons.webp             goblin-murder-dozer.webp             imani-p1.webp imani.webp imani-p2.webp             laminaks.webp             mongo-p1.webp mongo.webp mongo-p2.webp             mordecai-p1.webp mordecai.webp mordecai-p2.webp             odette-p1.webp odette.webp odette-p2.webp             prepotente.webp             princess-donut-p1.webp princess-donut.webp princess-donut-p2.webp             troglodytes.webp yolanda-martinez.webp
          do
            curl -fsSL "$BASE/assets/$f" -o "assets/$f"
          done
          touch .nojekyll

      - name: Commit corrected site
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Replace migrated site with latest correct DCC version"
          git push
